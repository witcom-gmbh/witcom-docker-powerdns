suite: "test deployment"
templates:
  - templates/ingress.yaml
values:
  - values/base.yaml
release:
  name: test  
tests:
  - it: should render ingress with default settings
    asserts:
      - notFailedTemplate: {}
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: test-powerdns-pdns
      - equal:
          path: spec.ingressClassName
          value: nginx-private
      - equal:
          path: spec.rules[0].host
          value: pdns-api.corp.org
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: test-powerdns-pdns
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8081
      - equal:
          path: spec.tls[0].hosts[0]
          value: pdns-api.corp.org

  - it: should not generate an ingress object if ingress is disabled
    set:
      ingress:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
