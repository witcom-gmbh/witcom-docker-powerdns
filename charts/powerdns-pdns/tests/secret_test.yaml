# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: "test secrets"
templates:
  - templates/secret*.yaml
values:
  - values/base.yaml
release:
  name: test  
tests:
  - it: should generate a secret for db-access
    template: templates/secret-db.yaml  
    asserts:
      - notFailedTemplate: {}
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: test-powerdns-pdns-db
      - equal:
          path: data.password
          value: dbpassword
          decodeBase64: true

  - it: should generate a custom secret for db-access
    template: templates/secret-db.yaml  
    set:
      pdns:
        database:
          secretKey: my-secret-key
    asserts:
      - notFailedTemplate: {}
      - equal:
          path: data.my-secret-key
          value: dbpassword
          decodeBase64: true

  - it: should not generate a secret for db-access if one is provided
    template: templates/secret-db.yaml
    set:
      pdns:
        database:
          existingSecret: db01-secret
          secretKey: password-key
    asserts:
      - hasDocuments:
          count: 0

  - it: should generate a secret for api-access
    template: templates/secret-api.yaml  
    asserts:
      - notFailedTemplate: {}
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: test-powerdns-pdns-api
      - equal:
          path: data.apikey
          value: topsecret
          decodeBase64: true

  - it: should not generate a secret for api-access if one is provided
    template: templates/secret-api.yaml
    set:
      pdns:
        web:
          api:
            existingSecret: api-secret
            secretKey: secret-key    
    asserts:
      - hasDocuments:
          count: 0
