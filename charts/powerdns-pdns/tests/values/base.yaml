pdns:
  database:
    backup:
      enabled: false
    db: powerdns
    host: db01-host
    password: dbpassword
    user: powerdns
  web:
    api:
      apiKey: topsecret
ingress:
  enabled: true
  className: "nginx-private"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: pdns-api.corp.org
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
   - secretName: pdns-tls
     hosts:
       - pdns-api.corp.org
