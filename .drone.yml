global-variables:
  environment: &default_environment
    PDNS_AUTH_RELEASE: 5.0.2
    PDNS_AUTH_IMAGE: powerdns/pdns-auth-50
    REGISTRY:
      from_secret: artifactory-host-01
    REGISTRY_HELM_PROJECT:  
      from_secret: artifactory-helm-project-01    
    USERNAME:
      from_secret: artifactory-user-01
    PASSWORD:
      from_secret: artifactory-password-01
    REGISTRY_ORG: powerdns
    REGISTRY_ARTIFACT_PDNS: pdns-auth
    REGISTRY_ARTIFACT_PDNS_INIT: pdns-auth-dbinit

kind: pipeline
type: docker
name: default
platform:
  os: linux
  arch: amd64 

steps:

  - name: Test helm chart
    image: alpine/helm:3.19
    environment:
      <<: *default_environment
    commands:
    - echo "Install helm-unittest" && helm plugin install https://github.com/helm-unittest/helm-unittest.git 
    - echo "Testing helm chart"
    - cd ./charts/powerdns-pdns && helm dependency update && helm unittest -s=false .

  - name: Prepare registry secrets
    image: alpine
    volumes:  
    - name: dockerconfig
      path: /dockerconfig
    environment:
      DOCKER_CONFIG:
        from_secret: artifactory-dockerconfig-01
    commands:
    - echo "$DOCKER_CONFIG" > /dockerconfig/config.json

  - name: Build DB init-image and push to latest
    image: gcr.io/kaniko-project/executor:debug
    environment:
      <<: *default_environment
    volumes:
    - name: dockerconfig
      path: /kaniko/.docker
    commands:
    - >
      /kaniko/executor 
      --context ./docker/pdns-auth-dbinit
      --dockerfile /docker/pdns-auth-dbinit/Dockerfile
      --destination $${REGISTRY}/$${REGISTRY_ORG}/$${REGISTRY_ARTIFACT_PDNS_INIT}:latest
    when:
      event:
        exclude:
        - tag
        include:
        - push
      branch:
      - main

  - name: Build pdns-auth image and push to latest
    image: gcr.io/kaniko-project/executor:debug
    environment:
      <<: *default_environment
    volumes:
    - name: dockerconfig
      path: /kaniko/.docker
    commands:
    - >
      /kaniko/executor 
      --context ./docker/pdns-auth
      --build-arg PDNS_AUTH_RELEASE=$${PDNS_AUTH_RELEASE}
      --build-arg PDNS_AUTH_IMAGE=$${PDNS_AUTH_IMAGE}
      --dockerfile ./docker/pdns-auth/Dockerfile
      --destination $${REGISTRY}/$${REGISTRY_ORG}/$${REGISTRY_ARTIFACT_PDNS}:latest
    when:
      event:
        exclude:
        - tag
        include:
        - push
      branch:
      - main

  - name: Build and release DB init-image
    image: gcr.io/kaniko-project/executor:debug
    environment:
      <<: *default_environment
    volumes:
    - name: dockerconfig
      path: /kaniko/.docker
    commands:
    - >
      /kaniko/executor 
      --context ./docker/pdns-auth-dbinit
      --dockerfile ./docker/pdns-auth-dbinit/Dockerfile
      --destination $${REGISTRY}/$${REGISTRY_ORG}/$${REGISTRY_ARTIFACT_PDNS_INIT}:latest
      --destination $${REGISTRY}/$${REGISTRY_ORG}/$${REGISTRY_ARTIFACT_PDNS_INIT}:v$${PDNS_AUTH_RELEASE}
    when:
      event:
      - tag
      ref:
      - refs/tags/* 

  - name: Build and release pdns-auth image
    image: gcr.io/kaniko-project/executor:debug
    environment:
      <<: *default_environment
    volumes:
    - name: dockerconfig
      path: /kaniko/.docker
    commands:
    - >
      /kaniko/executor 
      --context ./docker/pdns-auth
      --build-arg PDNS_AUTH_RELEASE=$${PDNS_AUTH_RELEASE}
      --build-arg PDNS_AUTH_IMAGE=$${PDNS_AUTH_IMAGE}
      --dockerfile ./docker/pdns-auth/Dockerfile
      --destination $${REGISTRY}/$${REGISTRY_ORG}/$${REGISTRY_ARTIFACT_PDNS}:latest
      --destination $${REGISTRY}/$${REGISTRY_ORG}/$${REGISTRY_ARTIFACT_PDNS}:v$${PDNS_AUTH_RELEASE}
    when:
      event:
      - tag
      ref:
      - refs/tags/* 

  - name: Package and deploy chart
    image: alpine/helm:3.19
    environment:
      <<: *default_environment
    commands:
    - helm registry login $${REGISTRY} -u $${USERNAME} -p $${PASSWORD}
    - cd ./charts/powerdns-pdns
    - helm package .
    - helm push *.tgz oci://$${REGISTRY}/$${REGISTRY_HELM_PROJECT}
    - helm registry logout $${REGISTRY}
    when:
      event:
      - tag
      ref:
      - refs/tags/v*

volumes:
- name: shared
  temp: {}
- name: build-output
  temp: {}
- name: dockerconfig
  temp: {}
- name: cache
  temp: {}

trigger:
  event:
  - tag
  - push
  - pull_request 
